{% extends 'base.html' %}{% block title %}Your profile | FarmLink{% endblock %}{% block content %}<section class="page-hero page-hero-small"><div class="wrap"><span class="eyebrow">THE PERSON BEHIND THE HARVEST</span><h1>Your <em>profile.</em></h1></div></section><section class="wrap narrow-wrap"><form method="post" class="editor-form form-stack">{% csrf_token %}<label>Full name<input name="full_name" value="{{ request.user.full_name }}" required></label><label>Phone number<input value="{{ request.user.phone }}" disabled><small>Phone number is verified at sign-in and can't be edited here.</small></label><label>City<input name="city" value="{{ request.user.city }}"></label><label>Region<input name="region" value="{{ request.user.region }}"></label><label>Account type<input value="{{ request.user.get_role_display }}" disabled></label><button class="button button-dark">Save profile <span>↗</span></button></form></section>{% endblock %}
